<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Goutham Gagan | Software, Applied AI, Product Engineering</title>
<desc id="desc">Technical midnight gradient banner with fine grid, circuit paths, a processing ring, warm ivory typography and animated teal signal.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D19"/><stop offset=".52" stop-color="#111B31"/><stop offset="1" stop-color="#17164B"/></linearGradient>
  <radialGradient id="wash" cx="80%" cy="46%" r="65%"><stop offset="0" stop-color="#4169E1" stop-opacity=".20"/><stop offset=".55" stop-color="#63E6D1" stop-opacity=".07"/><stop offset="1" stop-color="#080D19" stop-opacity="0"/></radialGradient>
  <linearGradient id="signal"><stop offset="0" stop-color="#63E6D1" stop-opacity="0"/><stop offset=".48" stop-color="#63E6D1"/><stop offset="1" stop-color="#9B9BFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9BAEC8" stroke-opacity=".075" stroke-width=".8"/></pattern>
  <pattern id="micro" width="112" height="112" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.4" fill="#63E6D1" fill-opacity=".28"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
