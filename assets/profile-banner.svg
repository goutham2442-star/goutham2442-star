<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Goutham Gagan — Developer</title><desc id="desc">Midnight navy banner with teal orbital lines and cream typography.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10152B"/><stop offset="1" stop-color="#170C79"/></linearGradient><linearGradient id="glow"><stop stop-color="#56B6C6" stop-opacity="0"/><stop offset=".5" stop-color="#56B6C6" stop-opacity=".9"/><stop offset="1" stop-color="#56B6C6" stop-opacity="0"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#56B6C6" stroke-opacity=".11" stroke-width="1"/></pattern></defs><rect width="1200" height="320" rx="20" fill="url(#bg)"/><rect width="1200" height="320" rx="20" fill="url(#grid)"/><g fill="none" stroke="#56B6C6" stroke-width="1.4" opacity=".55"><ellipse cx="1000" cy="158" rx="195" ry="80" transform="rotate(-28 1000 158)"><animateTransform attributeName="transform" type="rotate" from="-28 1000 158" to="332 1000 158" dur="42s" repeatCount="indefinite"/></ellipse><ellipse cx="1000" cy="158" rx="195" ry="80" transform="rotate(42 1000 158)"/><circle cx="1000" cy="158" r="9" fill="#56B6C6" stroke="none"><animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/></circle><path d="M0 275 Q300 230 570 273 T1200 250" stroke="url(#glow)" stroke-width="2"><animate attributeName="d" values="M0 275 Q300 230 570 273 T1200 250;M0 265 Q300 292 570 250 T1200 270;M0 275 Q300 230 570 273 T1200 250" dur="9s" repeatCount="indefinite"/></path></g><g font-family="Segoe UI, Arial, sans-serif"><text x="66" y="105" font-size="17" letter-spacing="5" fill="#56B6C6">DEVELOPER • AI EXPLORER</text><text x="62" y="170" font-size="58" font-weight="700" fill="#EFE3CA">GOUTHAM GAGAN</text><text x="66" y="210" font-size="21" fill="#C7D5E7">Building useful things, one commit at a time.</text><rect x="66" y="239" width="195" height="34" rx="17" fill="#56B6C6" fill-opacity=".12" stroke="#56B6C6" stroke-opacity=".65"/><text x="84" y="261" font-size="13" fill="#56B6C6" letter-spacing="1.4">CST • SOFTWARE • AI/ML</text></g><circle cx="1120" cy="60" r="2" fill="#EFE3CA"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="1090" cy="254" r="3" fill="#56B6C6"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle></svg>